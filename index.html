<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventario">
<title>Inventario Irish Tavern</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --bg2: #0f0f1a;
  --bg3: #16161f;
  --bg4: #1e1e2a;
  --border: #242432;
  --border2: #2e2e40;
  --text: #eeeef8;
  --text2: #8888a8;
  --text3: #4a4a62;
  --danger: #ff4444;
  --success: #22c55e;
  --font-head: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
  --font-mono: 'DM Mono', monospace;
  --nav-h: 64px;
  --top-h: 112px;
  --active: #3B82F6;
  --active-dim: rgba(59,130,246,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-body); }

/* TOP BAR */
#topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: env(safe-area-inset-top, 10px) 14px 0;
}
.top-row1 {
  display: flex; align-items: center; justify-content: space-between;
  padding-bottom: 9px;
}
.app-title {
  font-family: var(--font-head); font-size: 20px; font-weight: 800;
  letter-spacing: -0.5px; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.app-title .tag {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  background: var(--active-dim); color: var(--active);
  border: 1px solid var(--active); border-radius: 4px;
  padding: 2px 6px; letter-spacing: 1px;
}
.date-badge {
  font-family: var(--font-mono); font-size: 11px; color: var(--text3);
  background: var(--bg3); border: 1px solid var(--border);
  padding: 3px 8px; border-radius: 6px;
}
.top-row2 {
  display: flex; gap: 8px; align-items: center; padding-bottom: 9px;
}
#search {
  flex: 1; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 11px;
  font-family: var(--font-body); font-size: 15px; color: var(--text);
  outline: none;
}
#search::placeholder { color: var(--text3); }
#search:focus { border-color: var(--active); }
.btn-report {
  position: relative; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 12px;
  font-family: var(--font-head); font-size: 13px; font-weight: 700;
  color: var(--text2); cursor: pointer; white-space: nowrap; letter-spacing: .5px;
}
.btn-report.has-items { color: var(--active); border-color: var(--active); }
.btn-report .badge {
  position: absolute; top: -6px; right: -6px;
  background: var(--active); color: #fff;
  font-size: 10px; font-weight: 700; border-radius: 10px;
  padding: 1px 5px; min-width: 18px; text-align: center;
}

/* SCROLL */
#scroll-area {
  position: fixed;
  top: var(--top-h); left: 0; right: 0;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 6px 0 16px;
}

/* CATEGORY HEADER */
.cat-header {
  display: flex; align-items: center; gap: 8px;
  padding: 14px 14px 5px;
  position: sticky; top: 0; z-index: 10;
  background: var(--bg);
}
.cat-label {
  font-family: var(--font-head); font-size: 11px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; color: var(--text3);
}
.cat-line { flex: 1; height: 1px; background: var(--border); }
.unit-pill {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500;
  padding: 2px 7px; border-radius: 4px; letter-spacing: .5px;
  border: 1px solid var(--border2); color: var(--text3);
  background: var(--bg3);
}
.unit-pill.active { color: var(--active); border-color: var(--active); background: var(--active-dim); }

/* PRODUCT ROW */
.prod-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 14px; border-bottom: 1px solid var(--border);
}
.prod-row.has-qty { background: var(--active-dim); }
.prod-info { flex: 1; min-width: 0; }
.prod-name {
  font-size: 14px; font-weight: 500; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.prod-row.has-qty .prod-name { color: var(--active); font-weight: 600; }
.prod-unit {
  font-family: var(--font-mono); font-size: 10px; color: var(--text3); margin-top: 1px;
}
.qty-controls {
  display: flex; align-items: center;
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden; flex-shrink: 0;
}
.qty-btn {
  width: 36px; height: 38px; border: none; background: transparent;
  color: var(--text2); font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.qty-btn:active { background: var(--border); }
.qty-sep { width: 1px; height: 22px; background: var(--border); flex-shrink: 0; }
.qty-val {
  width: 40px; text-align: center;
  font-family: var(--font-mono); font-size: 17px; font-weight: 500;
  color: var(--text); background: transparent; border: none; outline: none;
  -moz-appearance: textfield;
}
.qty-val::-webkit-outer-spin-button, .qty-val::-webkit-inner-spin-button { -webkit-appearance: none; }
.qty-val.active { color: var(--active); }

/* BOTTOM NAV */
#bottomnav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: var(--bg2); border-top: 1px solid var(--border);
  display: flex; overflow-x: auto; -webkit-overflow-scrolling: touch;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  scrollbar-width: none;
}
#bottomnav::-webkit-scrollbar { display: none; }
.nav-btn {
  flex: 0 0 auto; min-width: 70px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; border: none; background: transparent; padding: 6px 8px;
}
.nav-bar { width: 22px; height: 3px; border-radius: 2px; background: var(--text3); }
.nav-btn.active .nav-bar { height: 4px; background: var(--nav-color, var(--active)); }
.nav-label {
  font-family: var(--font-head); font-size: 10px; font-weight: 700;
  letter-spacing: .5px; color: var(--text3); white-space: nowrap;
}
.nav-btn.active .nav-label { color: var(--nav-color, var(--active)); }
.nav-dot { width: 4px; height: 4px; border-radius: 50%; background: transparent; }
.nav-btn.has-data .nav-dot { background: var(--nav-color, var(--text3)); }

/* REPORT PANEL */
#report-panel {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.8); display: none; align-items: flex-end;
}
#report-panel.open { display: flex; }
.report-sheet {
  width: 100%; max-height: 90vh;
  background: var(--bg2); border-radius: 18px 18px 0 0;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 16px);
  animation: slideup .22s ease-out;
}
@keyframes slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }
.report-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--border2); margin: 11px auto 0;
}
.report-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px 10px; border-bottom: 1px solid var(--border);
}
.report-title {
  font-family: var(--font-head); font-size: 18px; font-weight: 800;
}
.report-close {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg3); border: none; color: var(--text2);
  font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.report-body { flex: 1; overflow-y: auto; padding: 12px 18px; }
.report-prov-block { margin-bottom: 18px; }
.report-prov-name {
  font-family: var(--font-head); font-size: 12px; font-weight: 800;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 3px 9px; border-radius: 5px; display: inline-block; margin-bottom: 8px;
}
.report-item {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 13px;
}
.report-item:last-child { border-bottom: none; }
.report-item-name { color: var(--text); flex: 1; padding-right: 10px; }
.report-item-right {
  display: flex; align-items: baseline; gap: 4px;
}
.report-item-qty {
  font-family: var(--font-mono); font-size: 16px; font-weight: 500;
  min-width: 24px; text-align: right;
}
.report-item-unit {
  font-family: var(--font-mono); font-size: 10px; color: var(--text3);
}
.report-empty {
  text-align: center; padding: 40px 20px;
  font-family: var(--font-head); font-size: 16px; color: var(--text3); letter-spacing: 1px;
}
.report-footer {
  display: flex; gap: 9px; padding: 11px 18px 4px; border-top: 1px solid var(--border);
}
.btn-action {
  flex: 1; padding: 13px; border-radius: 10px; border: none; cursor: pointer;
  font-family: var(--font-head); font-size: 14px; font-weight: 700; letter-spacing: .5px;
}
.btn-clear { background: var(--bg3); color: var(--danger); border: 1px solid var(--danger); }
.btn-export { background: var(--active); color: #fff; }

/* TOAST */
#toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: var(--bg4); border: 1px solid var(--border2);
  padding: 12px 24px; border-radius: 12px;
  font-family: var(--font-head); font-size: 16px; font-weight: 700; color: var(--text);
  z-index: 300; pointer-events: none; opacity: 0; transition: opacity .2s;
}
#toast.show { opacity: 1; }
</style>
</head>

<div id="topbar">

const PROVS = Object.keys(DATA);
const STORAGE_KEY = 'inventario_irish_tavern_v1';

let currentProv = PROVS[0];
let quantities = {};

// Load from localStorage
function loadData() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) quantities = JSON.parse(saved);
  } catch(e) { quantities = {}; }
}
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(quantities)); } catch(e) {}
}

function key(prov, name) { return prov + '||' + name; }
function getQty(prov, name) { return quantities[key(prov, name)] || 0; }
function setQty(prov, name, val) {
  val = Math.max(0, parseInt(val) || 0);
  if (val === 0) delete quantities[key(prov, name)];
  else quantities[key(prov, name)] = val;
  saveData();
  updateNav();
  updateBadge();
}

function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function formatDate() {
  const d = new Date();
  return d.toLocaleDateString('es-ES', { weekday:'short', day:'numeric', month:'short' }).toUpperCase();
}

function buildNav() {
  const nav = document.getElementById('bottomnav');
  nav.innerHTML = PROVS.map(p => {
    const label = p.length > 8 ? p.substring(0,8) + '…' : p;
    return `<button class="nav-btn${p===currentProv?' active':''}" data-prov="${p}"
      onclick="switchProv('${p}')" style="--nav-color:${DATA[p].color}">
      <div class="nav-bar"></div>
      <div class="nav-label">${label}</div>
      <div class="nav-dot"></div>
    </button>`;
  }).join('');
}

function switchProv(prov) {
  currentProv = prov;
  const color = DATA[prov].color;
  document.documentElement.style.setProperty('--active', color);
  document.documentElement.style.setProperty('--active-dim', hexToRgba(color, 0.1));
  document.getElementById('search').value = '';
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.prov === prov));
  renderList();
  document.getElementById('scroll-area').scrollTop = 0;
}

function renderList(filter) {
  const q = (filter || document.getElementById('search').value || '').toLowerCase().trim();
  const prov = DATA[currentProv];
  const color = DATA[currentProv].color;
  let html = '';

  Object.entries(prov.cats).forEach(([cat, cdata]) => {
    const filtered = q ? cdata.items.filter(n => n.toLowerCase().includes(q)) : cdata.items;
    if (!filtered.length) return;
    const withQty = filtered.filter(n => getQty(currentProv, n) > 0);
    const hasItems = withQty.length > 0;
    html += `<div class="cat-header">
      <div class="cat-label">${cat}</div>
      <div class="cat-line"></div>
      <div class="unit-pill ${hasItems?'active':''}">${cdata.unit.toUpperCase()}</div>
    </div>`;

    filtered.forEach((name, i) => {
      const qty = getQty(currentProv, name);
      const hasQty = qty > 0;
      const esc = name.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      html += `<div class="prod-row ${hasQty?'has-qty':''}">
        <div class="prod-info">
          <div class="prod-name">${name}</div>
          <div class="prod-unit">${cdata.unit}</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn" onclick="adj('${currentProv}','${esc}',-1)">−</button>
          <div class="qty-sep"></div>
          <input class="qty-val ${hasQty?'active':''}" type="number" min="0"
            value="${qty||''}" placeholder="0"
            onchange="setQtyR('${currentProv}','${esc}',this.value)"
            onfocus="this.select()">
          <div class="qty-sep"></div>
          <button class="qty-btn" onclick="adj('${currentProv}','${esc}',1)">+</button>
        </div>
      </div>`;
    });
  });

  if (!html) html = `<div style="text-align:center;padding:60px 20px;color:var(--text3);font-family:var(--font-head);font-size:16px;letter-spacing:1px">SIN RESULTADOS</div>`;
  document.getElementById('scroll-area').innerHTML = html;
}

function adj(prov, name, delta) {
  setQty(prov, name, Math.max(0, getQty(prov, name) + delta));
  renderList();
}
function setQtyR(prov, name, val) { setQty(prov, name, val); renderList(); }

function updateNav() {
  document.querySelectorAll('.nav-btn').forEach(b => {
    const p = b.dataset.prov;
    const has = Object.keys(quantities).some(k => k.startsWith(p + '||'));
    b.classList.toggle('has-data', has);
  });
}

function updateBadge() {
  const total = Object.keys(quantities).length;
  const badge = document.getElementById('report-badge');
  badge.textContent = total;
  badge.style.display = total > 0 ? 'block' : 'none';
  document.getElementById('btn-report').classList.toggle('has-items', total > 0);
}

function openReport() {
  let html = ''; let hasAny = false;
  PROVS.forEach(prov => {
    const items = Object.entries(quantities)
      .filter(([k]) => k.startsWith(prov + '||'))
      .map(([k, v]) => {
        const name = k.split('||')[1];
        const unit = getUnit(prov, name);
        return { name, qty: v, unit };
      });
    if (!items.length) return;
    hasAny = true;
    const c = DATA[prov].color;
    html += `<div class="report-prov-block">
      <div class="report-prov-name" style="color:${c};background:${hexToRgba(c,.12)}">${prov}</div>`;
    items.forEach(i => {
      html += `<div class="report-item">
        <span class="report-item-name">${i.name}</span>
        <div class="report-item-right">
          <span class="report-item-qty" style="color:${c}">${i.qty}</span>
          <span class="report-item-unit">${i.unit}</span>
        </div>
      </div>`;
    });
    html += '</div>';
  });
  if (!hasAny) html = '<div class="report-empty">SIN DATOS<br>ANOTADOS</div>';
  document.getElementById('report-body').innerHTML = html;
  document.getElementById('report-date').textContent = formatDate();
  document.getElementById('report-panel').classList.add('open');
}
function closeReport() { document.getElementById('report-panel').classList.remove('open'); }
function closePanelIfBg(e) { if (e.target.id === 'report-panel') closeReport(); }

function getUnit(prov, name) {
  const cats = DATA[prov]?.cats || {};
  for (const [cat, cdata] of Object.entries(cats)) {
    if (cdata.items.includes(name)) return cdata.unit;
  }
  return '';
}

function confirmClear() {
  if (confirm('¿Borrar todo el inventario? No se puede deshacer.')) {
    quantities = {};
    saveData();
    updateNav();
    updateBadge();
    renderList();
    closeReport();
    showToast('¡Inventario borrado!');
  }
}

function exportInventory() {
  let lines = [`INVENTARIO IRISH TAVERN — ${formatDate()}\n`];
  let hasAny = false;
  PROVS.forEach(prov => {
    const items = Object.entries(quantities)
      .filter(([k]) => k.startsWith(prov + '||'))
      .map(([k, v]) => ({ name: k.split('||')[1], qty: v, unit: getUnit(prov, k.split('||')[1]) }));
    if (!items.length) return;
    hasAny = true;
    lines.push(`\n── ${prov} ──`);
    items.forEach(i => lines.push(`  ${i.name}: ${i.qty} ${i.unit}`));
  });
  if (!hasAny) { showToast('Sin datos'); return; }
  const text = lines.join('\n');
  if (navigator.share) {
    navigator.share({ title: 'Inventario Irish Tavern', text }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('¡Copiado!'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('¡Copiado!');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

document.getElementById('search').addEventListener('input', e => renderList(e.target.value));

// Init
loadData();
document.getElementById('date-badge').textContent = formatDate();
const initColor = DATA[PROVS[0]].color;
document.documentElement.style.setProperty('--active', initColor);
document.documentElement.style.setProperty('--active-dim', hexToRgba(initColor, 0.1));
buildNav();
updateNav();
updateBadge();
renderList();
</script>
</body>
</html>
